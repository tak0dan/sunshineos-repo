# Hyprland tiling Wayland compositor profile.
format_version = 1
id = "hyprland"
name = "Hyprland"
description = "Hyprland compositor with a status bar, launcher and portal support."

required_capabilities = [
  "desktop-session-discovery",
  "sunshine-profile-management",
  "network-connection",
  "audio-pipewire",
]
